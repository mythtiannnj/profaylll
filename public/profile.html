<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="icon" href="/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="stylesheet" href="/assets/css/ui.css" />
  <style>
    .profile-hero {
      position: relative;
      border-radius: var(--radius-xl);
      padding: 2.2rem;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .profile-hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.16), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(167, 139, 250, 0.14), transparent 45%);
      pointer-events: none;
    }
    .profile-hero::after {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 3px;
      background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple));
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
    }

    .profile-inner {
      position: relative;
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar-ring {
      padding: 3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-cyan));
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-inner {
      padding: 3px;
      border-radius: 50%;
      background: #070a12;
    }
    .avatar-inner img {
      width: 130px; height: 130px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #0d1422;
    }
    .avatar-status {
      position: absolute;
      bottom: 6px; right: 6px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent-emerald);
      border: 3px solid #070a12;
      box-shadow: 0 0 10px var(--accent-emerald);
    }

    .profile-body { flex: 1; min-width: 0; }
    .profile-name {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.4rem;
    }
    .verified-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15),
                  0 0 20px -4px rgba(34, 211, 238, 0.85);
      animation: badgePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .verified-badge svg { width: 14px; height: 14px; }
    @keyframes badgePop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .profile-role {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 0.85rem;
    }
    .profile-meta {
      display: flex; flex-wrap: wrap; gap: 1.1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .profile-meta span { display: inline-flex; align-items: center; gap: 0.35rem; }

    .bio-card {
      padding: 1.5rem 1.6rem;
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
    }
    .bio-card .label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .bio-card .label::before {
      content: '';
      width: 22px; height: 1px;
      background: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
    }
    .bio-card p {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text-dim);
    }

    .socials {
      display: flex; flex-wrap: wrap; gap: 0.55rem;
      margin-top: 1rem;
    }
    .socials a {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.5rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border-2);
      color: var(--text-dim);
      background: var(--panel-soft);
      transition: all var(--transition-fast);
    }
    .socials a:hover {
      color: var(--accent-cyan);
      border-color: rgba(34, 211, 238, 0.5);
      background: rgba(34, 211, 238, 0.08);
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .profile-inner { flex-direction: column; text-align: center; }
      .profile-meta, .socials { justify-content: center; }
      .avatar-inner img { width: 108px; height: 108px; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="ambient">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-purple"></div>
    <div class="blob blob-pink"></div>
  </div>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"><i class="fas fa-id-badge"></i></span>
      <div class="brand-text"><span data-cfg="profile.name">Chris</span> <small>Profile</small></div>
    </div>
    <div class="topbar-right">
      <div class="theme-toggle">
        <button data-theme="dark" class="active"><i class="fas fa-circle-half-stroke"></i> Dark</button>
        <button data-theme="glass"><i class="fas fa-droplet"></i> Glass</button>
      </div>
      <button class="icon-btn hamburger" id="hamburger-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="menu-line top-line" d="M4 6h16"/>
          <path class="menu-line middle-line" d="M4 12h16"/>
          <path class="menu-line bottom-line" d="M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="brand">
        <span class="brand-mark"><i class="fas fa-user"></i></span>
        <div><h2 data-cfg="profile.name">Chris</h2><small>Personal</small></div>
      </div>
      <button class="icon-btn" id="drawer-close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-label">Navigate</div>
      <nav class="drawer-nav">
        <a href="/"><span class="nav-icon"><i class="fas fa-house"></i></span><span class="nav-label">Home <small>Welcome</small></span></a>
        <a href="/profile" class="active"><span class="nav-icon"><i class="fas fa-id-badge"></i></span><span class="nav-label">Profile <small>About me</small></span></a>
<a href="/music">
  <span class="nav-icon"><i class="fas fa-music"></i></span>
  <span class="nav-label">Music <small>On repeat</small></span>
</a>
        <a href="/hobbies"><span class="nav-icon"><i class="fas fa-heart"></i></span><span class="nav-label">Hobbies <small>What I love</small></span></a>

<a href="/education">
  <span class="nav-icon"><i class="fas fa-graduation-cap"></i></span>
  <span class="nav-label">Education <small>School & program</small></span>
</a>
        <a href="/contact"><span class="nav-icon"><i class="fas fa-envelope"></i></span><span class="nav-label">Contact <small>Reach out</small></span></a>
        <a href="/gallery"><span class="nav-icon"><i class="fas fa-images"></i></span><span class="nav-label">Gallery <small>Moments</small></span></a>
<a href="/about">
  <span class="nav-icon"><i class="fas fa-circle-info"></i></span>
  <span class="nav-label">About Site <small>Info & purpose</small></span>
</a>
      </nav>
    </div>
    <div class="drawer-footer"><span class="status-dot"></span> Online now</div>
  </aside>

  <div class="main-shell">
    <div class="container" style="max-width:900px;">
      <section class="profile-hero glass animate-reveal">
        <div class="profile-inner">
          <div class="avatar-wrap">
            <div class="avatar-ring">
              <div class="avatar-inner">
                <img id="avatar" data-cfg-src="profile.avatar" src="" alt="Avatar" />
              </div>
            </div>
            <span class="avatar-status"></span>
          </div>
          <div class="profile-body">
            <h1 class="profile-name">
              <span data-cfg="profile.name">Chris</span>
              <span class="verified-badge" data-verified style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </h1>
            <p class="profile-role" data-cfg="profile.role">—</p>
            <div class="profile-meta">
              <span><i class="fas fa-location-dot"></i> <span data-cfg="profile.location">—</span></span>
              <span><i class="fas fa-cake-candles"></i> Since <span data-cfg="profile.birthday">—</span></span>
            </div>
          </div>
        </div>
      </section>

      <section class="bio-card glass animate-reveal" style="animation-delay:0.1s;">
        <span class="label"><i class="fas fa-quote-left"></i> About Me</span>
        <p data-cfg="profile.bio">—</p>
      </section>

      <section class="bio-card glass animate-reveal" style="animation-delay:0.15s;">
        <span class="label"><i class="fas fa-share-nodes"></i> Find me on</span>
        <div class="socials" id="socials"></div>
      </section>

      <footer>
        <p>© 2026 <span data-cfg="profile.name">Chris</span> · Made with <i class="fas fa-heart" style="color:var(--accent-pink)"></i></p>
      </footer>
    </div>
  </div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/menu.js"></script>
  <script src="/assets/js/config.js"></script>
  <script>
    // Render socials from config
    window.addEventListener('load', () => {
      setTimeout(() => {
        const cfg = window.getConfig();
        const wrap = document.getElementById('socials');
        if (!wrap || !cfg?.socials) return;
        wrap.innerHTML = cfg.socials.map(s =>
          `<a href="${s.url}" target="_blank" rel="noopener"><i class="fab ${s.icon}"></i> ${s.name}</a>`
        ).join('');
      }, 500);
    });
  </script>
</body>
</html>
