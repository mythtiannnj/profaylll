<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome · Chris</title>
  <meta name="description" content="Welcome to my personal corner of the internet — coffee, jogging, guitars, and simple things." />
  <link rel="icon" href="/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="stylesheet" href="/assets/css/ui.css" />
  <style>
    .hero {
      min-height: calc(100vh - 84px);
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
    }
    .hero-inner { max-width: 780px; width: 100%; }
    .hero-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100px; height: 100px;
      border-radius: 26px; margin-bottom: 1.6rem;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(167, 139, 250, 0.10));
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--accent-cyan);
      font-size: 2.6rem;
      box-shadow: 0 0 60px -12px rgba(34, 211, 238, 0.55),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 600; letter-spacing: -0.02em;
      line-height: 1.05; margin-bottom: 1.2rem;
    }
    .hero-sub {
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      color: var(--text-dim);
      max-width: 560px;
      margin: 0 auto 2.4rem;
      line-height: 1.7;
    }
    .hero-actions {
      display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap;
      margin-bottom: 3rem;
    }
    .hero-features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
      max-width: 720px;
      margin: 0 auto;
    }
    .feature {
      padding: 1.1rem 0.7rem;
      border-radius: var(--radius);
      text-align: center;
    }
    .feature i {
      font-size: 1.3rem;
      color: var(--accent-cyan);
      margin-bottom: 0.5rem;
      display: block;
    }
    .feature .lbl {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    @media (max-width: 640px) { .hero-features { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body data-theme="dark">
  <div class="ambient">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-purple"></div>
    <div class="blob blob-pink"></div>
  </div>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"><i class="fas fa-user"></i></span>
      <div class="brand-text"><span data-cfg="profile.name">Chris</span> <small>Personal</small></div>
    </div>
    <div class="topbar-right">
      <div class="theme-toggle">
        <button data-theme="dark" class="active"><i class="fas fa-circle-half-stroke"></i> Dark</button>
        <button data-theme="glass"><i class="fas fa-droplet"></i> Glass</button>
      </div>
      <button class="icon-btn hamburger" id="hamburger-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="menu-line top-line" d="M4 6h16"/>
          <path class="menu-line middle-line" d="M4 12h16"/>
          <path class="menu-line bottom-line" d="M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="brand">
        <span class="brand-mark"><i class="fas fa-user"></i></span>
        <div>
          <h2 data-cfg="profile.name">Chris</h2>
          <small>Personal</small>
        </div>
      </div>
      <button class="icon-btn" id="drawer-close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-label">Navigate</div>
      <nav class="drawer-nav">
        <a href="/" class="active"><span class="nav-icon"><i class="fas fa-house"></i></span><span class="nav-label">Home <small>Welcome</small></span></a>
        <a href="/profile"><span class="nav-icon"><i class="fas fa-id-badge"></i></span><span class="nav-label">Profile <small>About me</small></span></a>
        <a href="/hobbies"><span class="nav-icon"><i class="fas fa-heart"></i></span><span class="nav-label">Hobbies <small>What I love</small></span></a>
        <a href="/contact"><span class="nav-icon"><i class="fas fa-envelope"></i></span><span class="nav-label">Contact <small>Reach out</small></span></a>
        <a href="/gallery"><span class="nav-icon"><i class="fas fa-images"></i></span><span class="nav-label">Gallery <small>Moments</small></span></a>
      </nav>
    </div>
    <div class="drawer-footer"><span class="status-dot"></span> Online now</div>
  </aside>

  <div class="main-shell">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-icon animate-reveal"><i class="fas fa-hand-sparkles"></i></div>
        <h1 class="animate-reveal" style="animation-delay:0.1s;">
          <span class="brand-gradient-text">Hi, I'm <span data-cfg="profile.name">Chris</span> 👋</span>
        </h1>
        <p class="hero-sub animate-reveal" style="animation-delay:0.2s;" data-cfg="site.tagline">
          Welcome to my corner of the internet.
        </p>
        <div class="hero-actions animate-reveal" style="animation-delay:0.3s;">
          <a href="/profile" class="btn btn-primary"><i class="fas fa-user"></i> About Me</a>
          <a href="/contact" class="btn btn-ghost"><i class="fas fa-paper-plane"></i> Say Hi</a>
        </div>
        <div class="hero-features animate-reveal" style="animation-delay:0.4s;">
          <a href="/hobbies" class="feature glass"><i class="fas fa-person-running"></i><div class="lbl">Jogging</div></a>
          <a href="/hobbies" class="feature glass"><i class="fas fa-mug-hot"></i><div class="lbl">Coffee</div></a>
          <a href="/hobbies" class="feature glass"><i class="fas fa-guitar"></i><div class="lbl">Guitar</div></a>
          <a href="/hobbies" class="feature glass"><i class="fas fa-moon"></i><div class="lbl">Sleep</div></a>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2025 <span data-cfg="profile.name">Chris</span> · Made with <i class="fas fa-heart" style="color:var(--accent-pink)"></i></p>
    </footer>
  </div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/menu.js"></script>
  <script src="/assets/js/config.js"></script>
</body>
</html>
