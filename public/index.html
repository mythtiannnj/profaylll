<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome · Chris</title>
  <meta name="description" content="Welcome to my personal corner of the internet — coffee, jogging, guitars, and simple things." />
  <meta name="theme-color" content="#070a12" />
  <link rel="icon" href="/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="stylesheet" href="/assets/css/ui.css" />
  <style>
    /* ---- Hero ---- */
    .hero {
      min-height: calc(100vh - 84px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      position: relative;
    }
    .hero-inner {
      max-width: 820px;
      width: 100%;
      position: relative;
    }

    /* Greeting chip */
    .greeting-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.28);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 1.5rem;
    }
    .greeting-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Avatar */
    .hero-avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.4rem;
    }
    .hero-avatar-ring {
      padding: 3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-cyan));
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero-avatar-inner {
      padding: 3px;
      border-radius: 50%;
      background: #070a12;
    }
    .hero-avatar-inner img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #0d1422;
    }

    /* Headline */
    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 1.2rem;
    }
    .hero h1 .wave {
      display: inline-block;
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%, 40% { transform: rotate(-8deg); }
    }

    /* Sub */
    .hero-sub {
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      color: var(--text-dim);
      max-width: 580px;
      margin: 0 auto 2.4rem;
      line-height: 1.7;
    }

    /* Live clock */
    .hero-clock {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      margin-bottom: 1.6rem;
    }
    .hero-clock i {
      color: var(--accent-cyan);
      font-size: 0.7rem;
    }

    /* Actions */
    .hero-actions {
      display: flex;
      gap: 0.9rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    /* Feature tiles */
    .hero-features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
      max-width: 720px;
      margin: 0 auto;
    }
    .feature {
      padding: 1.1rem 0.7rem;
      border-radius: var(--radius);
      text-align: center;
      text-decoration: none;
      transition: all var(--transition);
      display: block;
    }
    .feature:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 211, 238, 0.4);
      box-shadow: var(--shadow-card), 0 0 30px -10px rgba(34, 211, 238, 0.5);
    }
    .feature i {
      font-size: 1.35rem;
      color: var(--accent-cyan);
      margin-bottom: 0.5rem;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .feature:hover i { transform: scale(1.15); }
    .feature .lbl {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .hero-features { grid-template-columns: repeat(2, 1fr); }
      .hero-avatar-inner img { width: 80px; height: 80px; }
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.6rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }
    footer a { color: var(--accent-cyan); font-weight: 600; }
    footer .heart { color: var(--accent-pink); }
  </style>
</head>
<body data-theme="dark">
  <!-- Ambient Background -->
  <div class="ambient">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-purple"></div>
    <div class="blob blob-pink"></div>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"><i class="fas fa-user"></i></span>
      <div class="brand-text">
        <span data-cfg="profile.name">Chris</span>
        <small>Personal</small>
      </div>
    </div>
    <div class="topbar-right">
      <div class="theme-toggle">
        <button data-theme="dark" class="active">
          <i class="fas fa-circle-half-stroke"></i> Dark
        </button>
        <button data-theme="glass">
          <i class="fas fa-droplet"></i> Glass
        </button>
      </div>
      <button class="icon-btn hamburger" id="hamburger-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="menu-line top-line" d="M4 6h16"/>
          <path class="menu-line middle-line" d="M4 12h16"/>
          <path class="menu-line bottom-line" d="M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="brand">
        <span class="brand-mark"><i class="fas fa-user"></i></span>
        <div>
          <h2 data-cfg="profile.name">Chris</h2>
          <small>Personal</small>
        </div>
      </div>
      <button class="icon-btn" id="drawer-close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-label">Navigate</div>
      <nav class="drawer-nav">
        <a href="/" class="active">
          <span class="nav-icon"><i class="fas fa-house"></i></span>
          <span class="nav-label">Home <small>Welcome</small></span>
        </a>
        <a href="/profile">
          <span class="nav-icon"><i class="fas fa-id-badge"></i></span>
          <span class="nav-label">Profile <small>About me</small></span>
        </a>
        <a href="/hobbies">
          <span class="nav-icon"><i class="fas fa-heart"></i></span>
          <span class="nav-label">Hobbies <small>What I love</small></span>
        </a>
        <a href="/contact">
          <span class="nav-icon"><i class="fas fa-envelope"></i></span>
          <span class="nav-label">Contact <small>Reach out</small></span>
        </a>
        <a href="/gallery">
          <span class="nav-icon"><i class="fas fa-images"></i></span>
          <span class="nav-label">Gallery <small>Moments</small></span>
        </a>
      </nav>
    </div>
    <div class="drawer-footer"><span class="status-dot"></span> Online now</div>
  </aside>

  <!-- Main -->
  <div class="main-shell">
    <section class="hero">
      <div class="hero-inner">

        <!-- Greeting chip -->
        <div class="greeting-chip animate-reveal">
          <span class="dot"></span>
          <span id="greeting-text">Welcome</span>
        </div>

        <!-- Avatar -->
        <div class="hero-avatar-wrap animate-reveal" style="animation-delay:0.05s;">
          <div class="hero-avatar-ring">
            <div class="hero-avatar-inner">
              <img id="hero-avatar" data-cfg-src="profile.avatar" src="" alt="Chris" />
            </div>
          </div>
        </div>

        <!-- Headline -->
        <h1 class="animate-reveal" style="animation-delay:0.1s;">
          <span class="brand-gradient-text">
            Hi, I'm <span data-cfg="profile.name">Chris</span> <span class="wave">👋</span>
          </span>
        </h1>

        <!-- Sub -->
        <p class="hero-sub animate-reveal" style="animation-delay:0.15s;" data-cfg="site.tagline">
          Welcome to my corner of the internet.
        </p>

        <!-- Live clock -->
        <div class="hero-clock animate-reveal" style="animation-delay:0.2s;">
          <i class="fas fa-clock"></i>
          <span id="live-clock">—</span>
        </div>

        <!-- Actions -->
        <div class="hero-actions animate-reveal" style="animation-delay:0.25s;">
          <a href="/profile" class="btn btn-primary">
            <i class="fas fa-user"></i> About Me
          </a>
          <a href="/contact" class="btn btn-ghost">
            <i class="fas fa-paper-plane"></i> Say Hi
          </a>
        </div>

        <!-- Feature tiles (4 hobbies) -->
        <div class="hero-features animate-reveal" style="animation-delay:0.3s;">
          <a href="/hobbies" class="feature glass">
            <i class="fas fa-person-running"></i>
            <div class="lbl">Jogging</div>
          </a>
          <a href="/hobbies" class="feature glass">
            <i class="fas fa-mug-hot"></i>
            <div class="lbl">Coffee</div>
          </a>
          <a href="/hobbies" class="feature glass">
            <i class="fas fa-guitar"></i>
            <div class="lbl">Guitar</div>
          </a>
          <a href="/hobbies" class="feature glass">
            <i class="fas fa-moon"></i>
            <div class="lbl">Sleep</div>
          </a>
        </div>

      </div>
    </section>

    <footer>
      <p>
        © <span id="year">2026</span>
        <span data-cfg="profile.name">Chris</span>
        · Made with <i class="fas fa-heart heart"></i>
      </p>
    </footer>
  </div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/menu.js"></script>
  <script src="/assets/js/config.js"></script>
  <script>
    // ---- Live clock (updates every second) ----
    function tick() {
      const el = document.getElementById('live-clock');
      if (el) {
        const now = new Date();
        el.textContent = now.toLocaleString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });
      }
    }
    setInterval(tick, 1000);
    tick();

    // ---- Time-aware greeting ----
    function updateGreeting() {
      const el = document.getElementById('greeting-text');
      if (!el) return;
      const h = new Date().getHours();
      let greeting = 'Welcome';
      if (h < 5) greeting = 'Still up?';
      else if (h < 12) greeting = 'Good morning';
      else if (h < 17) greeting = 'Good afternoon';
      else if (h < 21) greeting = 'Good evening';
      else greeting = 'Good night';
      el.textContent = greeting;
    }
    updateGreeting();
    setInterval(updateGreeting, 60000);

    // ---- Auto year ----
    const y = document.getElementById('year');
    if (y) y.textContent = new Date().getFullYear();
  </script>
</body>
</html>
