<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · Chris</title>
  <link rel="icon" href="/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="stylesheet" href="/assets/css/ui.css" />
  <style>
    .page-head { text-align: center; margin-bottom: 2.5rem; }
    .page-head h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .page-head p { color: var(--text-dim); font-size: 0.95rem; max-width: 520px; margin: 0 auto; line-height: 1.6; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.9rem;
    }
    .gallery-item {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1/1;
      transition: all var(--transition);
    }
    .gallery-item:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(34, 211, 238, 0.35);
      box-shadow: var(--shadow-card), 0 0 40px -12px rgba(34, 211, 238, 0.4);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gallery-item:hover img { transform: scale(1.06); }
    .gallery-item figcaption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.5rem 0.9rem 0.9rem;
      background: linear-gradient(to top, rgba(7, 10, 18, 0.98) 0%, transparent 100%);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      pointer-events: none;
    }
    .gallery-item figcaption small {
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      opacity: 0.9;
    }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4, 7, 13, 0.92);
      backdrop-filter: blur(16px);
      opacity: 0; pointer-events: none;
      transition: opacity var(--transition);
      padding: 2rem;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9);
      object-fit: contain;
    }
    .lightbox .close-hint {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body data-theme="dark">
  <div class="ambient">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-purple"></div>
    <div class="blob blob-pink"></div>
  </div>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"><i class="fas fa-images"></i></span>
      <div class="brand-text"><span data-cfg="profile.name">Chris</span> <small>Gallery</small></div>
    </div>
    <div class="topbar-right">
      <div class="theme-toggle">
        <button data-theme="dark" class="active"><i class="fas fa-circle-half-stroke"></i> Dark</button>
        <button data-theme="glass"><i class="fas fa-droplet"></i> Glass</button>
      </div>
      <button class="icon-btn hamburger" id="hamburger-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="menu-line top-line" d="M4 6h16"/>
          <path class="menu-line middle-line" d="M4 12h16"/>
          <path class="menu-line bottom-line" d="M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="brand">
        <span class="brand-mark"><i class="fas fa-user"></i></span>
        <div><h2 data-cfg="profile.name">Chris</h2><small>Personal</small></div>
      </div>
      <button class="icon-btn" id="drawer-close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-label">Navigate</div>
      <nav class="drawer-nav">
        <a href="/"><span class="nav-icon"><i class="fas fa-house"></i></span><span class="nav-label">Home <small>Welcome</small></span></a>
        <a href="/profile"><span class="nav-icon"><i class="fas fa-id-badge"></i></span><span class="nav-label">Profile <small>About me</small></span></a>
        <a href="/hobbies"><span class="nav-icon"><i class="fas fa-heart"></i></span><span class="nav-label">Hobbies <small>What I love</small></span></a>
         <a href="/education">
  <span class="nav-icon"><i class="fas fa-graduation-cap"></i></span>
  <span class="nav-label">Education <small>School & program</small></span>
</a>
        <a href="/contact"><span class="nav-icon"><i class="fas fa-envelope"></i></span><span class="nav-label">Contact <small>Reach out</small></span></a>
        <a href="/gallery" class="active"><span class="nav-icon"><i class="fas fa-images"></i></span><span class="nav-label">Gallery <small>Moments</small></span></a>
      </nav>
    </div>
    <div class="drawer-footer"><span class="status-dot"></span> Online now</div>
  </aside>

  <div class="main-shell">
    <div class="container" style="max-width:1100px;">
      <header class="page-head animate-reveal">
        <h1><span class="brand-gradient-text" id="gallery-title">Moments</span></h1>
        <p id="gallery-subtitle">Snapshots from my everyday life.</p>
      </header>

      <section class="gallery-grid" id="gallery-grid">
        <!-- Populated from config.json -->
      </section>

      <footer>
        <p>© 2026 <span data-cfg="profile.name">Chris</span> · Made with <i class="fas fa-heart" style="color:var(--accent-pink)"></i></p>
      </footer>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="close-hint">Click anywhere to close · ESC</div>
    <img src="" alt="Preview" />
  </div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/menu.js"></script>
  <script src="/assets/js/config.js"></script>
</body>
</html>
